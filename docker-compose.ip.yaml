# IP-based deployment of the UI (Next.js).
# The container is NOT published directly — the API's nginx proxies :5554 -> ui:3000
# over the shared `miseenscreen` network.
#
# The public API URL is baked into the JS bundle at BUILD time and is read from
# the committed .env.production (HOST_URL / NEXT_PUBLIC_API_URL). To change the
# server IP, edit .env.production and rebuild — no env vars needed:
#   docker compose -f docker-compose.ip.yaml up -d --build
services:
  ui:
    build: .
    environment:
      - PORT=3000
      - HOSTNAME=ui
    networks:
      - ui-miseenscreen
    restart: 'always'
networks:
  ui-miseenscreen:
    driver: bridge
    name: miseenscreen

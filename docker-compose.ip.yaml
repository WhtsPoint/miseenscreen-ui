# IP-based deployment of the UI (Next.js).
# The container is NOT published directly — the API's nginx proxies :5554 -> ui:3000
# over the shared `miseenscreen` network.
#
# NEXT_PUBLIC_API_URL is baked into the JS bundle at BUILD time, so SERVER_IP must
# be set when building:
#   export SERVER_IP=1.2.3.4
#   docker compose -f docker-compose.ip.yaml up -d --build
services:
  ui:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=http://${SERVER_IP}:5553/api/v0/
        - HOST_URL=http://${SERVER_IP}:5554
    environment:
      - PORT=3000
      - HOSTNAME=ui
    networks:
      - ui-miseenscreen
    restart: 'always'
networks:
  ui-miseenscreen:
    driver: bridge
    name: miseenscreen
